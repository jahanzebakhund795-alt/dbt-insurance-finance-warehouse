[build-system]
      requires = ["setuptools>=68"]
      build-backend = "setuptools.build_meta"

      [project]
      name = "dbt-insurance-finance-warehouse"
      version = "0.1.0"
      description = "dbt Insurance Finance Warehouse - synthetic portfolio implementation"
      requires-python = ">=3.9"
      dependencies = [
        "duckdb>=1.1,<1.5",
"dbt-duckdb>=1.9,<1.10",
      ]

      [project.optional-dependencies]
      test = ["pytest>=8,<9", "httpx>=0.27,<0.29"]

      [tool.setuptools.packages.find]
      where = ["src"]

      [tool.setuptools.package-data]
      "*" = ["*.sql"]

      [tool.pytest.ini_options]
      testpaths = ["tests"]
      pythonpath = ["src"]
